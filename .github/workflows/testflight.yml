name: TestFlight

# v から始まるタグを push するか、Actions 画面から手動で実行すると、TestFlight にアップロードする。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: 必要なシークレットがあるか確認
        run: |
          for name in BUNDLE_ID APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::シークレット $name が設定されていません"
              exit 1
            fi
          done

      - name: Xcode 26 以降を選択
        # App Store Connect は Xcode 26 以降 (iOS 26 SDK 以降) でビルドしたアプリだけを受け付ける。
        run: |
          echo "入っている Xcode:"
          ls -d /Applications/Xcode*.app
          latest=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$latest" ]; then
            echo "::error::Xcode 26 以降がこのランナーにありません"
            exit 1
          fi
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: テスト
        working-directory: MadoriCore
        run: swift test

      - name: Xcode プロジェクトを生成
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App Store Connect API キーを配置
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: アーカイブ
        run: |
          xcodebuild archive \
            -project MadoriFit.xcodeproj \
            -scheme MadoriFit \
            -destination 'generic/platform=iOS' \
            -archivePath build/MadoriFit.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: 書き出しと TestFlight へのアップロード
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/MadoriFit.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: アーカイブを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MadoriFit-xcarchive
          path: build/MadoriFit.xcarchive
          retention-days: 7
          if-no-files-found: ignore

      - name: API キーを削除
        if: always()
        run: rm -f "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
