name: TestFlight

# v から始まるタグを push するか、Actions 画面から手動で実行すると、TestFlight にアップロードする。
# テストは、通常の CI (core-tests.yml) で済んでいるものとして、ここでは動かさない（macOS の分数の節約）。タグを打つ前に、CI が通っているか確認する。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 同時に 2 つ動かさない（同じビルド番号や、アップロードの衝突を避ける）。
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      # 固定した配布用証明書とプロファイル（任意。設定すると、証明書が作られ続ける問題を避けられる）
      DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
      DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: 必要なシークレットがあるか確認
        run: |
          for name in BUNDLE_ID APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::シークレット $name が設定されていません"
              exit 1
            fi
          done

      - name: ビルド番号を決める
        # 日時 (UTC) を使う。実行し直しても、常に前回より大きくなる。
        run: echo "BUILD_NUMBER=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Xcode 26 以降を選択
        # App Store Connect は Xcode 26 以降 (iOS 26 SDK 以降) でビルドしたアプリだけを受け付ける。
        run: |
          echo "入っている Xcode:"
          ls -d /Applications/Xcode*.app
          latest=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$latest" ]; then
            echo "::error::Xcode 26 以降がこのランナーにありません"
            exit 1
          fi
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Xcode プロジェクトを生成
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App Store Connect API キーを配置
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: アーカイブして TestFlight にアップロード
        # 署名の方式は ci/archive-and-upload.sh が、シークレットの有無で切り替える。
        run: ./ci/archive-and-upload.sh

      - name: アーカイブを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MadoriFit-xcarchive
          path: build/MadoriFit.xcarchive
          retention-days: 7
          if-no-files-found: ignore

      - name: API キーを削除
        if: always()
        run: rm -f "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
