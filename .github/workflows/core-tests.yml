name: MadoriCore tests

on:
  push:
    paths:
      - "MadoriCore/**"
      - "App/**"
      - "project.yml"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "MadoriCore/**"
      - "App/**"
      - "project.yml"

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: MadoriCore
        run: swift test

  ios-build:
    # macOS 向けのビルドでは除外される iOS 専用コード（RoomPlan によるスキャン）をビルドで確認する。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: xcodebuild (iOS)
        working-directory: MadoriCore
        run: >
          xcodebuild build
          -scheme MadoriApp
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO

  app-build:
    # project.yml から Xcode プロジェクトを生成し、署名なしでアプリ本体をビルドできるか確認する。
    # TestFlight 用のシークレットが無くても動く。
    runs-on: macos-15
    env:
      BUNDLE_ID: com.example.madorifit
      APPLE_TEAM_ID: ABCDE12345
      BUILD_NUMBER: "1"
    steps:
      - uses: actions/checkout@v4
      - name: xcodegen
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Info.plist がビルド設定のバージョンを参照しているか確認
        run: |
          build=$(plutil -extract CFBundleVersion raw Config/Info.plist)
          short=$(plutil -extract CFBundleShortVersionString raw Config/Info.plist)
          echo "CFBundleVersion=$build"
          echo "CFBundleShortVersionString=$short"
          [ "$build" = '$(CURRENT_PROJECT_VERSION)' ] || { echo "::error::CFBundleVersion がビルド設定を参照していません"; exit 1; }
          [ "$short" = '$(MARKETING_VERSION)' ] || { echo "::error::CFBundleShortVersionString がビルド設定を参照していません"; exit 1; }
      - name: xcodebuild (シミュレータ向け、署名なし)
        run: >
          xcodebuild build
          -project MadoriFit.xcodeproj
          -scheme MadoriFit
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
