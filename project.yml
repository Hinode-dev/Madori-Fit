# XcodeGen の設定。`xcodegen generate` で MadoriFit.xcodeproj を作る（リポジトリには入れない）。
# 環境変数: BUNDLE_ID, APPLE_TEAM_ID, BUILD_NUMBER
name: MadoriFit
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  MadoriCore:
    path: MadoriCore
targets:
  MadoriFit:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: MadoriCore
        product: MadoriApp
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Madori Fit
        # XcodeGen の既定値 (1 / 1.0) で固定されないよう、ビルド設定を参照する。
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 部屋をスキャンして間取りを作成するためにカメラを使用します。
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Config/MadoriFit.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
schemes:
  MadoriFit:
    build:
      targets:
        MadoriFit: all
    archive:
      config: Release
